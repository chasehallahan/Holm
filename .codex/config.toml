# Unity CLI + com.unity.pipeline, scoped to this project.
# Update the paths if this checkout or the Unity CLI moves.
[mcp_servers.unity]
command = "C:\\Users\\chase\\AppData\\Local\\Unity\\bin\\unity.exe"
args = ["mcp", "--project-path", "C:\\Code\\Repos\\Personal\\Hólm"]
